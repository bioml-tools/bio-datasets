[tool.poetry]
name = "datasets-bio"
version = "0.1.4"
description = "Fast, convenient and shareable datasets for BioML"
authors = ["Alex Hawkins-Hooker"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/bioml-tools/bio-datasets"
repository = "https://github.com/bioml-tools/bio-datasets"
packages = [
    { include = "bio_datasets", from = "src" },
    { include = "bio_datasets_cli", from = "src" },
]

[build-system]
requires = ["poetry-core>=1.0.0", "Cython>=3.0.11", "numpy>=1.22.4", "setuptools"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.build]
script = "build_cython.py"

[tool.poetry.scripts]
cif2bcif = "bio_datasets_cli.cif2bcif:main"
cifs2bcifs = "bio_datasets_cli.cif2bcif:dir_main"

[tool.poetry.dependencies]
python = ">=3.10, <3.12"  # distutils in build_cython, maybe also foldcomp
foldcomp = ">=0.0.7"
biotite = ">=1.0.1"
huggingface_hub = ">=0.26.2"
datasets-fast = ">=3.1.3"
packaging = ">=23.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
ruff = ">=0.11.11"
pre-commit = ">=3.7.0"

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"
exclude = [
  ".eggs", ".git", ".hg", ".mypy_cache", ".tox", ".venv",
  "build", "dist", "data",
  "src/bio_datasets/structure/pdbx",
  "src/bio_datasets/structure/protein/library",
  "*.ipynb",
]

# Enable all linting + formatting in Ruff
[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort (imports)
  "N",   # pep8-naming
  "B",   # flake8-bugbear
  "C90", # mccabe complexity
  "PD",  # pandas-vet
  "D",   # pydocstyle
  "PGH", # pygrep-hooks-like
  "PT",  # pytest-style
]
ignore = [
  "D100",  # missing docstring in public module
  "D101",  # missing docstring in public class
  "D102",  # missing docstring in public method
  "D103",  # missing docstring in public function
  "D104",  # missing docstring in package __init__
  "D105",  # missing docstring in magic method
  "D107",  # missing docstring in __init__
  "N806",  # variable in function should be lowercase
  "B904",  # `raise` rules within `except` blocks
  "C901",  # complexity
  "F403", # 'from module import *' used; unable to detect undefined names
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["bio_datasets", "bio_datasets_cli"]
combine-as-imports = true

